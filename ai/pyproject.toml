[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mikserstudio-ai"
version = "0.1.0"
description = "The MCP bridge of Mikser Studio: offers its commands to agents as MCP tools, through its local API."
authors = [{ name = "Infinitinker" }]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]
# aiohttp talks to the app's local API. Nothing else is needed at run time.
dependencies = ["aiohttp>=3.12"]

[project.optional-dependencies]
dev = ["import-linter>=2.16", "mypy>=2.4", "pytest>=9.2", "pytest-aiohttp>=1.1", "ruff>=0.17"]

[tool.hatch.build.targets.wheel]
packages = ["src/mikserstudio_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "tests"]

# The directions imports may run in, as "Import directions" in docs/architecture.md writes them
# down. Checked with lint-imports, run from ai/.
[tool.importlinter]
root_package = "mikserstudio_ai"

[[tool.importlinter.contracts]]
name = "The MCP bridge is layered: entry point, bridge, the app client and the tools, discovery"
type = "layers"
layers = [
    "mikserstudio_ai.mcp.__main__",
    "mikserstudio_ai.mcp.bridge",
    "mikserstudio_ai.mcp.app | mikserstudio_ai.mcp.tools",
    "mikserstudio_ai.mcp.discovery",
]
