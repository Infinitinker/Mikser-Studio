[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mikserstudio-ai"
version = "0.1.0"
description = "AI sidecar service of Mikser Studio: runs AI backends behind a local HTTP API."
authors = [{ name = "Infinitinker" }]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]
# aiohttp serves the local API and talks to HTTP backends (Ollama). Nothing else is needed at run time.
dependencies = ["aiohttp>=3.12"]

[project.scripts]
mikserstudio-ai = "mikserstudio_ai.__main__:main"

# Every AI backend announces itself here: "<id> = <module>:create", where create(settings) -> Backend.
[project.entry-points."mikserstudio_ai.backends"]
builtin = "mikserstudio_ai.backends.builtin:create"
ollama = "mikserstudio_ai.backends.ollama:create"

[dependency-groups]
dev = ["mypy>=1.18", "pytest>=8.4", "pytest-aiohttp>=1.1", "ruff>=0.13"]

[tool.hatch.build.targets.wheel]
packages = ["src/mikserstudio_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "tests"]
