# StyLua's settings for the plugins (docs/plugins.md, "Tooling"): those of the scripts in tools/, Lua
# 5.4 with four spaces and lines of up to 120 characters, like the C++ code.
syntax = "Lua54"
column_width = 120
line_endings = "Unix"
indent_type = "Spaces"
indent_width = 4
quote_style = "AutoPreferDouble"
call_parentheses = "Always"
