[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "mikser-studio-tools"
version = "0.0.0"
description = "The repository's own tools for Mikser Studio, not the app."
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
dependencies = []

[project.optional-dependencies]
dev = [
    "pillow>=13.0",
    "ruff>=0.17",
    "mypy>=2.4",
    "pytest>=9.2",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["tools"]

[tool.pytest.ini_options]
testpaths = ["tools"]
