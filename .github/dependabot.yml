# Once a month, one pull request to dev with new versions of the actions the workflows and the shared
# actions in .github/actions use. Package ecosystems are left out: the C++ libraries, and the Lua that
# runs the scripts in tools/, come from MSYS2, which has no Dependabot support; upgrading what a release
# ships means testing the app and writing THIRD-PARTY-NOTICES.md again (docs/releasing.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    target-branch: dev
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Warsaw
    groups:
      actions:
        patterns: ["*"]
