# Sets up Python 3.13, the version CLAUDE.md names, for the checks of the scripts in tools/, with pip's
# download cache keyed on tools/pyproject.toml. Used in checks.yml; jobs that run Python inside MSYS2
# (Licenses, build-windows.yml) use MSYS2's own. Needs a checkout first, as every local action does.
name: Python
description: Sets up Python 3.13 with pip's download cache.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.13"
        cache: pip
        cache-dependency-path: tools/pyproject.toml
