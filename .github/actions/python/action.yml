# Sets up the AI service's Python, 3.13 (CLAUDE.md and ai/pyproject.toml's requires-python), with pip's
# download cache, and with `venv: true` also its virtual environment ai/.venv with the dev extra, where
# the app and the tests look for it. Used in checks.yml and e2e.yml; jobs that run Python inside
# MSYS2 (Licenses, build-windows.yml) use MSYS2's own. Needs a checkout first, as every local action
# does.
name: Python
description: Sets up Python 3.13 with pip's download cache, and optionally the AI service's ai/.venv.

inputs:
  venv:
    description: Whether to create ai/.venv and install the AI service with its dev extra into it.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.13"
        cache: pip
        cache-dependency-path: ai/pyproject.toml

    # The same commands as in docs/development.md, with bin/ in place of Scripts/ on Linux.
    - name: Create ai/.venv
      if: inputs.venv == 'true'
      shell: bash
      run: |
        python -m venv ai/.venv
        if [ -d ai/.venv/Scripts ]; then bin=ai/.venv/Scripts; else bin=ai/.venv/bin; fi
        "$bin/python" -m pip install -e "./ai[dev]"
