name: Connector request
description: Ask for Mikser Studio to work with another AI tool or service.
labels: [connector]
body:
  - type: textarea
    id: tool
    attributes:
      label: The tool or service
      description: Which AI tool or service, and what you would use it for in Mikser Studio.
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: The API it speaks
      description: >
        Whether it speaks a shared, open API, such as the OpenAI-compatible one, or only its own,
        with a link to its API docs.
